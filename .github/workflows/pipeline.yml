name: CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    uses: ./.github/workflows/codacy.yml
    secrets: inherit   # Codacy gebruikt CODACY_PROJECT_TOKEN
  sca:
    uses: ./.github/workflows/trivy.yml
  secrets:
    uses: ./.github/workflows/gitleaks.yml

  deploy:
    needs: [sast, sca, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Uitrollen
        env:
          BW_DB_PASSWORD: ${{ secrets.BW_DB_PASSWORD }}
          BW_ADMIN_PASSWORD: ${{ secrets.BW_ADMIN_PASSWORD }}
        run: docker compose -p tejbir_and_me-thegoat- up -d --build
      - name: Healthcheck
        run: |
          for i in $(seq 1 60); do
            curl -fsSkL \
              --resolve g13.ipv6.thelastgym.be:80:127.0.0.1 \
              --resolve g13.ipv6.thelastgym.be:443:127.0.0.1 \
              http://g13.ipv6.thelastgym.be/health && exit 0
            sleep 5
          done
          exit 1
