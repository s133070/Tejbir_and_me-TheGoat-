
name: gitleaks

on:
  workflow_call:

jobs:
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create custom Gitleaks config
        run: |
          cat > gitleaks.toml <<'EOF'
          title = "Unbreakable Secret Scanning"

          [extend]
          useDefault = true

          # Checkt hardcoded wachtwoorden
          [[rules]]
          id = "custom-password"
          description = "Detect hardcoded passwords"
          regex = '''(?i)\b(?:password|passwd|pwd|db_password|postgres_password)\b["']?\s*[:=]\s*["']?([^"'\s#]{6,})'''
          secretGroup = 1
          tags = ["password", "configuration"]

          # Checkt PostgreSQL connection strings met credentials
          [[rules]]
          id = "custom-database-credentials"
          description = "Detect PostgreSQL credentials"
          regex = '''(?i)postgres(?:ql)?://[^:\s/@]+:([^@\s/]+)@'''
          secretGroup = 1
          tags = ["database", "postgresql"]

          # Checkt hardcoded JWT signing secrets
          [[rules]]
          id = "custom-jwt-secret"
          description = "Detect JWT signing secrets"
          regex = '''(?i)\b(?:jwt_secret|jwt_signing_key|jwt_signing_secret)\b["']?\s*[:=]\s*["']?([^"'\s#]{8,})'''
          secretGroup = 1
          tags = ["jwt", "authentication"]

          # Checkt Docker Compose databasewachtwoorden
          [[rules]]
          id = "custom-docker-password"
          description = "Detect Docker credentials"
          regex = '''(?i)\b(?:POSTGRES_PASSWORD|DATABASE_PASSWORD|REDIS_PASSWORD)\b["']?\s*[:=]\s*["']?([^"'\s#]{6,})'''
          secretGroup = 1
          tags = ["docker", "credentials"]
          EOF

      - name: Gitleaks scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            git /repo \
            --config /repo/gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --report-format json \
            --report-path /repo/gitleaks.json

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
