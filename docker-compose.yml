services:
  app:
    build: ./app
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=${APP_DB_NAME:-unbreakable};Username=${APP_DB_USER:-unbreakable};Password=${APP_DB_PASSWORD}"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - bw-services
      - app-db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${APP_DB_NAME:-unbreakable}"
      POSTGRES_USER: "${APP_DB_USER:-unbreakable}"
      POSTGRES_PASSWORD: "${APP_DB_PASSWORD}"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-db

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://kc-db:5432/${KC_DB_NAME:-keycloak}"
      KC_DB_USERNAME: "${KC_DB_USER:-keycloak}"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
      KC_HOSTNAME: https://g13.ipv6.thelastgym.be/auth
      KC_HOSTNAME_ADMIN: http://localhost:8081/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD}"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - kc-db
    restart: unless-stopped
    networks:
      - bw-services
      - kc-db

  kc-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${KC_DB_NAME:-keycloak}"
      POSTGRES_USER: "${KC_DB_USER:-keycloak}"
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD}"
    volumes:
      - kcdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kc-db

  bunkerweb:
    image: bunkerity/bunkerweb:1.6.16
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.16
    depends_on:
      - bunkerweb
      - bw-db
    volumes:
      - bw-storage:/data
    environment:
      BUNKERWEB_INSTANCES: "bunkerweb"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
      DATABASE_URI: "mariadb+pymysql://bunkerweb:${BW_DB_PASSWORD}@bw-db:3306/db"
      SERVER_NAME: "g13.ipv6.thelastgym.be"
      USE_IPV6: "yes"
      DISABLE_DEFAULT_SERVER: "yes"
      AUTO_LETS_ENCRYPT: "yes"
      USE_LETS_ENCRYPT_STAGING: "no"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://app:8080"
      REVERSE_PROXY_URL_2: "/auth"
      REVERSE_PROXY_HOST_2: "http://keycloak:8080"
      BLACKLIST_URI: "^/auth/admin"
      ALLOWED_METHODS: "GET|POST|HEAD|DELETE"
      USE_MODSECURITY: "yes"
      USE_MODSECURITY_CRS: "yes"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-db

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.6.16
    depends_on:
      - bw-db
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - bw-ui-data:/data
    environment:
      DATABASE_URI: "mariadb+pymysql://bunkerweb:${BW_DB_PASSWORD}@bw-db:3306/db"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${BW_ADMIN_PASSWORD}"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-db

  bw-db:
    image: mariadb:11
    command: --max-allowed-packet=67108864
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "${BW_DB_PASSWORD}"
    volumes:
      - bw-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - bw-db

volumes:
  dbdata:
  kcdata:
  bw-storage:
  bw-data:
  bw-ui-data:

networks:
  bw-universe:
    name: bw-universe
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.20.30.0/24
        - subnet: fd00:13:38::/64
  bw-services:
    name: bw-services
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.20.40.0/24
        - subnet: fd00:13:37::/64
  app-db:
    internal: true
  kc-db:
    internal: true
  bw-db:
    name: bw-db
    internal: true
